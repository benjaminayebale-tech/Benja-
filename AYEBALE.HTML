<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, intial-scale=1.2">
    <title>MY CALCULATOR</title>
    <link rel="stylesheet" href="AYEBALE.CSS">
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" value="0" style="color:white;"readonly>
    <div class="buttons">
        <button class="clear">AC</button>
        <button>00</button>
        <button>%</button>
        <button class="operator">/</button>
    </div>
    <div>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">*</button>
    </div>
    <div>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">+</button>
    </div>
    <div>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">-</button>
    </div>
    <div>
        <button class="back">0</button>
        <button>.</button>
        <button class="operator">=</button>
    </div>

    </div>
</body>
</html>
